name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-do-not-use-in-prod
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: testpass
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Enforce read-only contract on admin_analytics.py
        run: |
          # Match only actual function calls (with paren) or SQL DML keywords
          # followed by a SQL identifier. Docstrings mentioning these terms are fine.
          PATTERN='db\.(add|delete|commit|merge|flush)\(|text\(['"'"'"]\s*(INSERT|UPDATE|DELETE)\s+'
          if grep -nE "$PATTERN" backend/app/routes/admin_analytics.py; then
            echo ""
            echo "ERROR: backend/app/routes/admin_analytics.py contains write operations."
            echo "This module MUST be read-only. Move any mutation to a different module."
            exit 1
          fi
          echo "OK: admin_analytics.py is read-only"

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v --tb=short
